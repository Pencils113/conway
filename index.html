<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Conway · Game of Life</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230a0614'/%3E%3Crect x='4' y='4' width='3' height='3' fill='%23a78bfa'/%3E%3Crect x='9' y='4' width='3' height='3' fill='%23a78bfa'/%3E%3Crect x='4' y='9' width='3' height='3' fill='%23a78bfa'/%3E%3Crect x='9' y='9' width='3' height='3' fill='%23a78bfa'/%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="stage"></canvas>

  <header class="hud hud-tl">
    <div class="brand">
      <span class="dot"></span>
      <span class="brand-title">conway</span>
      <span class="brand-sub">game of life</span>
    </div>
    <div class="select-wrap">
      <select id="preset" aria-label="Preset pattern">
        <option value="">— preset —</option>
      </select>
    </div>
    <button id="fullscreen-btn" class="btn icon" title="Fullscreen" aria-label="Fullscreen">
      <svg class="ico-fs-enter" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
      </svg>
      <svg class="ico-fs-exit" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>
      </svg>
    </button>
    <button id="settings-btn" class="btn icon" title="Settings (s)" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <aside class="hud hud-tr stats" aria-live="polite">
    <div class="stat"><span class="lbl">gen</span><span id="gen" class="val">0</span></div>
    <div class="stat"><span class="lbl">pop</span><span id="pop" class="val">0</span></div>
    <div class="stat"><span class="lbl">fps</span><span id="fps" class="val">—</span></div>
  </aside>

  <footer class="hud hud-bc controls">
    <button id="step-back" class="btn icon" title="Step back (not supported in basic life)" disabled>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 6h2v12H6zM20 6 9 12l11 6z"/></svg>
    </button>
    <button id="step" class="btn icon" title="Step (→)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M5 4l12 8-12 8z"/><path d="M18 4h2v16h-2z"/></svg>
    </button>
    <button id="play" class="btn play" title="Play / Pause (space)">
      <svg class="ico-play" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 4l14 8L6 20z"/></svg>
      <svg class="ico-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    </button>
    <div class="speed">
      <label for="speed" class="lbl">speed</label>
      <input id="speed" type="range" min="0" max="100" value="50" />
      <span id="speed-val" class="val">10/s</span>
    </div>
    <button id="reset" class="btn ghost" title="Reset to last loaded pattern (R)">reset</button>
    <button id="clear" class="btn ghost" title="Clear all cells (C)">clear</button>
    <button id="center" class="btn ghost" title="Recenter view (F)">center</button>
  </footer>

  <div id="hint" class="hud hud-bl hint"></div>

  <div class="zen-hint"><kbd>h</kbd> show controls</div>

  <div id="settings-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-panel" role="dialog" aria-labelledby="settings-title" aria-modal="true">
      <header class="modal-head">
        <h2 id="settings-title">Settings</h2>
        <button class="btn icon modal-x" data-close aria-label="Close settings">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>

      <div class="modal-body">
        <section class="settings-section">
          <h3>Input bindings</h3>
          <p class="section-desc">Pick the gesture you'd rather use. Conflicts get resolved automatically.</p>

          <div class="row binding"><span class="row-title">Toggle cell</span>
            <select data-bind="toggle"></select></div>
          <div class="row binding"><span class="row-title">Pan</span>
            <select data-bind="pan"></select></div>
          <div class="row binding"><span class="row-title">Paint cells</span>
            <select data-bind="paint"></select></div>
          <div class="row binding"><span class="row-title">Zoom</span>
            <select data-bind="zoom"></select></div>
        </section>

        <label class="row easter-row">
          <span class="row-title">conway mode</span>
          <span class="switch">
            <input type="checkbox" id="conway-mode" />
            <span class="track" aria-hidden="true"></span>
          </span>
        </label>
      </div>

      <footer class="modal-foot">
        <button id="settings-reset" class="btn ghost">Reset to defaults</button>
        <button class="btn" data-close>Done</button>
      </footer>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
