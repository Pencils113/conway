<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Conway · Game of Life</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230a0614'/%3E%3Crect x='4' y='4' width='3' height='3' fill='%23a78bfa'/%3E%3Crect x='9' y='4' width='3' height='3' fill='%23a78bfa'/%3E%3Crect x='4' y='9' width='3' height='3' fill='%23a78bfa'/%3E%3Crect x='9' y='9' width='3' height='3' fill='%23a78bfa'/%3E%3C/svg%3E" />
</head>
<body>
  <canvas id="stage"></canvas>

  <header class="hud hud-tl">
    <div class="brand">
      <span class="dot"></span>
      <span class="brand-title">conway</span>
      <span class="brand-sub">game of life</span>
    </div>
    <div class="select-wrap">
      <select id="preset" aria-label="Preset pattern">
        <option value="">— preset —</option>
      </select>
    </div>
  </header>

  <aside class="hud hud-tr stats" aria-live="polite">
    <div class="stat"><span class="lbl">gen</span><span id="gen" class="val">0</span></div>
    <div class="stat"><span class="lbl">pop</span><span id="pop" class="val">0</span></div>
    <div class="stat"><span class="lbl">fps</span><span id="fps" class="val">—</span></div>
  </aside>

  <footer class="hud hud-bc controls">
    <button id="step-back" class="btn icon" title="Step back (not supported in basic life)" disabled>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 6h2v12H6zM20 6 9 12l11 6z"/></svg>
    </button>
    <button id="step" class="btn icon" title="Step (→)">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M5 4l12 8-12 8z"/><path d="M18 4h2v16h-2z"/></svg>
    </button>
    <button id="play" class="btn play" title="Play / Pause (space)">
      <svg class="ico-play" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 4l14 8L6 20z"/></svg>
      <svg class="ico-pause" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    </button>
    <div class="speed">
      <label for="speed" class="lbl">speed</label>
      <input id="speed" type="range" min="0" max="100" value="50" />
      <span id="speed-val" class="val">10/s</span>
    </div>
    <button id="reset" class="btn ghost" title="Reset to last loaded pattern (R)">reset</button>
    <button id="clear" class="btn ghost" title="Clear all cells (C)">clear</button>
    <button id="center" class="btn ghost" title="Recenter view (F)">center</button>
  </footer>

  <div class="hud hud-bl hint">
    <kbd>drag</kbd> pan · <kbd>scroll</kbd> zoom · <kbd>click</kbd> toggle · <kbd>shift+drag</kbd> paint
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
